<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan, Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button,input{font-family:inherit}
button{cursor:pointer}
input::placeholder{color:#B8B3C4}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chips{scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14121A; color: #FFFFFF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="padding: 18px 20px 0 20px">
<h1 style="margin: 0; font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -0.03em">Plan<span style="color: #FFD23F">.</span></h1>
</header>
<nav aria-label="Plan sections" style="display: flex; gap: 6px; padding: 12px 20px 4px 20px">
<a href="Today.dc.html" aria-current="page" style="height: 40px; padding: 0 14px; border-radius: 8px; background: #FFD23F; color: #14121A; font-size: 14px; font-weight: 700; display: flex; align-items: center; text-decoration: none">Today</a>
<a href="Goal.dc.html" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #6E6782; color: #FFFFFF; font-size: 14px; font-weight: 500; display: flex; align-items: center; text-decoration: none">Goals</a>
<a href="Promises.dc.html" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #6E6782; color: #FFFFFF; font-size: 14px; font-weight: 500; display: flex; align-items: center; text-decoration: none">Promises</a>
<a href="Reviews.dc.html" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; border: 1px solid #6E6782; color: #FFFFFF; font-size: 14px; font-weight: 500; display: flex; align-items: center; text-decoration: none">Reviews</a>
</nav>
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 10px 20px 8px 20px">
<div style="font-size: 15px; font-weight: 600">Saturday 10 Oct</div>
<div style="font-size: 14px; color: #B8B3C4">{{ answeredText }}</div>
</div>

<main style="flex: 1; min-height: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">

<section aria-labelledby="t-far" style="background: #2A2535; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 id="t-far" style="margin: 0; font-size: 17px; font-weight: 700">Exam lectures</h2>
<div style="font-size: 13px; color: #B8B3C4">min 1 · target 2</div>
</div>
<div role="radiogroup" aria-labelledby="t-far" style="display: flex; gap: 6px">
<button role="radio" aria-checked="{{ far.did.on }}" onClick="{{ far.did.pick }}" style="flex: 1; height: 44px; box-sizing: border-box; border-radius: 10px; border: {{ far.did.border }}; background: {{ far.did.bg }}; color: {{ far.did.fg }}; font-size: 15px; font-weight: 700">Did it</button>
<button role="radio" aria-checked="{{ far.part.on }}" onClick="{{ far.part.pick }}" style="flex: 1; height: 44px; box-sizing: border-box; border-radius: 10px; border: {{ far.part.border }}; background: {{ far.part.bg }}; color: {{ far.part.fg }}; font-size: 15px; font-weight: 700">Part</button>
<button role="radio" aria-checked="{{ far.not.on }}" onClick="{{ far.not.pick }}" style="flex: 1; height: 44px; box-sizing: border-box; border-radius: 10px; border: {{ far.not.border }}; background: {{ far.not.bg }}; color: {{ far.not.fg }}; font-size: 15px; font-weight: 700">Not</button>
</div>
<sc-if value="{{ far.showAmount }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="font-size: 14px; color: #B8B3C4">How many?</span>
<div style="display: flex; align-items: center; gap: 4px; background: #14121A; border-radius: 12px; padding: 2px">
<button aria-label="One less" onClick="{{ far.less }}" style="width: 44px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #FFFFFF; font-size: 22px; font-weight: 600">−</button>
<span aria-live="polite" style="min-width: 92px; text-align: center; font-size: 16px; font-weight: 700">{{ far.amountText }}</span>
<button aria-label="One more" onClick="{{ far.more }}" style="width: 44px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #FFFFFF; font-size: 22px; font-weight: 600">+</button>
</div>
</div>
</sc-if>
<sc-if value="{{ far.showReasons }}" hint-placeholder-val="{{ true }}">
<div style="font-size: 14px; color: #B8B3C4">What got in the way?</div>
<div class="chips" role="group" aria-label="What got in the way" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px; padding: 0 14px">
<sc-for list="{{ reasons }}" as="r" hint-placeholder-count="9">
<button aria-pressed="{{ r.on }}" onClick="{{ r.pick }}" style="flex: none; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 22px; border: {{ r.border }}; background: {{ r.bg }}; color: {{ r.fg }}; font-size: 14px; font-weight: 600">{{ r.label }}</button>
</sc-for>
</div>
<label for="far-note" class="sr">One line about it, optional</label>
<input id="far-note" type="text" placeholder="One line about it (optional)" style="height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid #3D3749; background: #14121A; color: #FFFFFF; padding: 0 12px; font-size: 15px">
</sc-if>
</section>

<section aria-labelledby="t-walk" style="background: #2A2535; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 id="t-walk" style="margin: 0; font-size: 17px; font-weight: 700">Walk</h2>
<div style="font-size: 13px; color: #B8B3C4">min 5 min · target 20 min</div>
</div>
<div role="radiogroup" aria-labelledby="t-walk" style="display: flex; gap: 6px">
<button role="radio" aria-checked="{{ walk.did.on }}" onClick="{{ walk.did.pick }}" style="flex: 1; height: 44px; box-sizing: border-box; border-radius: 10px; border: {{ walk.did.border }}; background: {{ walk.did.bg }}; color: {{ walk.did.fg }}; font-size: 15px; font-weight: 700">{{ walk.didLabel }}</button>
<button role="radio" aria-checked="{{ walk.part.on }}" onClick="{{ walk.part.pick }}" style="flex: 1; height: 44px; box-sizing: border-box; border-radius: 10px; border: {{ walk.part.border }}; background: {{ walk.part.bg }}; color: {{ walk.part.fg }}; font-size: 15px; font-weight: 700">Part</button>
<button role="radio" aria-checked="{{ walk.not.on }}" onClick="{{ walk.not.pick }}" style="flex: 1; height: 44px; box-sizing: border-box; border-radius: 10px; border: {{ walk.not.border }}; background: {{ walk.not.bg }}; color: {{ walk.not.fg }}; font-size: 15px; font-weight: 700">Not</button>
</div>
</section>

<section aria-labelledby="t-bed" style="background: #2A2535; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 id="t-bed" style="margin: 0; font-size: 17px; font-weight: 700">In bed by 12:30 am</h2>
<div style="font-size: 13px; color: {{ bed.statusColor }}">{{ bed.status }}</div>
</div>
<div role="radiogroup" aria-labelledby="t-bed" style="display: flex; gap: 6px">
<button role="radio" aria-checked="{{ bed.did.on }}" onClick="{{ bed.did.pick }}" style="flex: 1; height: 44px; box-sizing: border-box; border-radius: 10px; border: {{ bed.did.border }}; background: {{ bed.did.bg }}; color: {{ bed.did.fg }}; font-size: 15px; font-weight: 700">Did it</button>
<button role="radio" aria-checked="{{ bed.not.on }}" onClick="{{ bed.not.pick }}" style="flex: 1; height: 44px; box-sizing: border-box; border-radius: 10px; border: {{ bed.not.border }}; background: {{ bed.not.bg }}; color: {{ bed.not.fg }}; font-size: 15px; font-weight: 700">Not</button>
</div>
</section>

</main>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 20px 8px 20px">
<span style="font-size: 13px; color: #B8B3C4; line-height: 1.4">Unanswered stays "no answer". Nothing is guessed.</span>
<button style="height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #6E6782; background: transparent; color: #FFFFFF; font-size: 14px; font-weight: 600; white-space: nowrap">Rest day</button>
</div>

<nav aria-label="Main" style="display: flex; background: #0D0B12; padding: 6px 12px 16px 12px">
<a href="Talk.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #B8B3C4; font-size: 12px; font-weight: 500; text-decoration: none">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B8B3C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span>Talk</a>
<a href="Today.dc.html" aria-current="page" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #FFD23F; font-size: 12px; font-weight: 700; text-decoration: none">
<span style="width: 56px; height: 30px; border-radius: 15px; background: #2A2535; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFD23F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"></path></svg></span>Plan</a>
<a href="Know.dc.html" style="flex: 1; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #B8B3C4; font-size: 12px; font-weight: 500; text-decoration: none">
<span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B8B3C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a5 5 0 0 0-5 5c0 2 1 3 2 4v3h6v-3c1-1 2-2 2-4a5 5 0 0 0-5-5zM10 20h4"></path></svg></span>What I know</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = Object.assign({ far: 'part', farAmt: 1, reason: 'felt too big', walk: 'did', bed: null }, this.state || {});
const opt = (key, val) => {
const on = st[key] === val;
return {
on: on ? 'true' : 'false',
bg: on ? '#FFD23F' : 'transparent',
fg: on ? '#14121A' : '#FFFFFF',
border: on ? '0' : '1px solid #6E6782',
pick: () => this.setState({ [key]: on ? null : val })
};
};
const reasonList = ['tired', 'no time', 'forgot', 'avoided it', 'felt too big', 'sick', 'plans changed', 'low mood', 'other'];
const answered = ['far', 'walk', 'bed'].filter((k) => st[k]).length;
return {
answeredText: answered + ' of 3 answered',
far: {
did: opt('far', 'did'), part: opt('far', 'part'), not: opt('far', 'not'),
showAmount: st.far === 'part',
showReasons: st.far === 'part' || st.far === 'not',
amountText: st.farAmt + (st.farAmt === 1 ? ' lecture' : ' lectures'),
less: () => this.setState({ farAmt: Math.max(0, st.farAmt - 1) }),
more: () => this.setState({ farAmt: st.farAmt + 1 })
},
reasons: reasonList.map((label) => {
const on = st.reason === label;
return { label, on: on ? 'true' : 'false', bg: on ? '#FF6B5B' : 'transparent', fg: on ? '#14121A' : '#FFFFFF', border: on ? '0' : '1px solid #6E6782', pick: () => this.setState({ reason: on ? null : label }) };
}),
walk: { did: opt('walk', 'did'), part: opt('walk', 'part'), not: opt('walk', 'not'), didLabel: st.walk === 'did' ? 'Did it · 20 min' : 'Did it' },
bed: {
did: opt('bed', 'did'), not: opt('bed', 'not'),
status: st.bed ? 'Answered' : 'No answer yet',
statusColor: st.bed ? '#B8B3C4' : '#FFD23F'
}
};
}
}
</script>
</body>
</html>
