<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat type picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14121A; color: #FFFFFF; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div aria-hidden="true" style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 14px; opacity: 0.35">
<div style="font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; padding-left: 44px">Talk<span style="color: #FFD23F">.</span></div>
<div style="height: 120px; border-radius: 16px; background: #FFD23F"></div>
<div style="align-self: flex-end; width: 240px; height: 48px; border-radius: 16px; background: #FFFFFF"></div>
<div style="width: 300px; height: 96px; border-radius: 16px; background: #2A2535"></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8,7,12,0.72)"></div>

<section role="dialog" aria-modal="true" aria-labelledby="ct-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #2A2535; border-radius: 24px 24px 0 0; padding: 8px 0 20px 0; display: flex; flex-direction: column">
<div aria-hidden="true" style="width: 40px; height: 4px; border-radius: 2px; background: #6E6782; align-self: center; margin-bottom: 10px"></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px 6px 20px">
<h2 id="ct-title" style="margin: 0; font-size: 22px; font-weight: 700">Kind of conversation</h2>
<a href="Talk.dc.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<p style="margin: 0 20px 8px 20px; font-size: 14px; line-height: 1.45; color: #B8B3C4">Switching keeps this conversation. The next reply follows the new kind.</p>

<div role="radiogroup" aria-labelledby="ct-title" style="display: flex; flex-direction: column">
<sc-for list="{{ types }}" as="t" hint-placeholder-count="4">
<button role="radio" aria-checked="{{ t.checked }}" onClick="{{ t.pick }}" style="min-height: 66px; padding: 8px 20px; border: 0; background: {{ t.bg }}; color: #FFFFFF; display: flex; align-items: center; gap: 14px; text-align: left">
<span style="flex: 1"><span style="display: block; font-size: 17px; font-weight: 700">{{ t.name }}</span><span style="display: block; font-size: 14px; color: #B8B3C4; margin-top: 2px; line-height: 1.35">{{ t.desc }}</span></span>
<span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{ t.ring }}; display: flex; align-items: center; justify-content: center; flex: none"><span style="width: 12px; height: 12px; border-radius: 6px; background: {{ t.dot }}"></span></span>
</button>
</sc-for>
</div>

<div style="height: 1px; background: #3D3749; margin: 6px 20px"></div>
<div style="padding: 8px 20px 2px 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #FFD23F">Your focuses</div>
<div role="radiogroup" aria-label="Your focuses" style="display: flex; flex-direction: column">
<sc-for list="{{ focuses }}" as="f" hint-placeholder-count="2">
<button role="radio" aria-checked="{{ f.checked }}" onClick="{{ f.pick }}" style="min-height: 60px; padding: 6px 20px; border: 0; background: {{ f.bg }}; color: #FFFFFF; display: flex; align-items: center; gap: 14px; text-align: left">
<span style="flex: 1"><span style="display: block; font-size: 17px; font-weight: 600">{{ f.name }}</span><span style="display: block; font-size: 14px; color: #B8B3C4; margin-top: 2px">{{ f.desc }}</span></span>
<span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid {{ f.ring }}; display: flex; align-items: center; justify-content: center; flex: none"><span style="width: 12px; height: 12px; border-radius: 6px; background: {{ f.dot }}"></span></span>
</button>
</sc-for>
</div>
<p style="margin: 6px 20px 0 20px; font-size: 13px; line-height: 1.45; color: #B8B3C4">A new focus is suggested by the coach as a card, or started from What I know, Focuses.</p>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) || 'free';
const mk = (id, name, desc) => {
const on = sel === id;
return { name, desc, checked: on ? 'true' : 'false', bg: on ? '#353044' : 'transparent', ring: on ? '#FFD23F' : '#6E6782', dot: on ? '#FFD23F' : 'transparent', pick: () => this.setState({ sel: id }) };
};
return {
types: [
mk('free', 'Free talk', 'Just talk it through'),
mk('untangle', 'Untangle', 'Make sense of something tangled. No commitments.'),
mk('decide', 'Decide', 'Get clear before you choose. You keep the choice.'),
mk('plan', 'Plan and track', 'Goals, pace and what to change, with your numbers')
],
focuses: [
mk('f1', 'Social anxiety', 'Active, 6 conversations'),
mk('f2', 'Final exam', 'Active, 11 conversations')
]
};
}
}
</script>
</body>
</html>
