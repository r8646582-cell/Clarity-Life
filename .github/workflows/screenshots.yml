name: Record screenshots
# Takes new approved screenshots (Max plan Phase 7) and commits them to the branch it is run on.
# Run it by hand from the Actions tab only after a change to the look that the owner approved:
# Actions, Record screenshots, Run workflow, pick the branch. CI then compares every later push with them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Draw the screens and save the pictures
        run: ./gradlew --no-daemon testDebugUnitTest -Proborazzi.test.record=true --tests 'com.clarity.life.ui.quality.ScreenshotTest'
      - name: Commit the pictures to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          if git diff --cached --quiet; then echo "The screenshots did not change."; exit 0; fi
          git commit -m "Record the approved screenshots (Record screenshots workflow)"
          git push
      - name: Keep the pictures on this run's page too
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/screenshots/
          retention-days: 30
